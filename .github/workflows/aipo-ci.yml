name: AI Product Optimizer – CI

on:
  push:
    branches: [ "claude/ai-product-optimizer-spec-iFjV6", "main" ]
    paths:
      - "ai-product-optimizer/**"
      - ".github/workflows/aipo-ci.yml"
  pull_request:
    paths:
      - "ai-product-optimizer/**"

defaults:
  run:
    working-directory: ai-product-optimizer

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests (no WordPress environment required)
  # ---------------------------------------------------------------------------
  phpunit-unit:
    name: PHPUnit Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl, mbstring, intl
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests with coverage
        env:
          PHPUNIT_TESTSUITE: Unit
        run: |
          ./vendor/bin/phpunit \
            --testsuite Unit \
            --coverage-clover coverage/clover.xml \
            --coverage-text

      - name: Upload coverage to Codecov
        if: matrix.php == '8.3'
        uses: codecov/codecov-action@v4
        with:
          files: ai-product-optimizer/coverage/clover.xml
          flags: unit

  # ---------------------------------------------------------------------------
  # Integration tests (real WordPress + MySQL)
  # ---------------------------------------------------------------------------
  phpunit-integration:
    name: PHPUnit Integration Tests
    runs-on: ubuntu-latest
    needs: phpunit-unit

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wp_tests
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json, openssl, mbstring, intl, mysqli

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wp_tests root '' 127.0.0.1 latest

      - name: Run integration tests
        env:
          PHPUNIT_TESTSUITE: Integration
          WP_TESTS_DB_HOST: "127.0.0.1"
          WP_TESTS_DB_NAME: wp_tests
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: ""
        run: ./vendor/bin/phpunit --testsuite Integration

  # ---------------------------------------------------------------------------
  # PHP_CodeSniffer
  # ---------------------------------------------------------------------------
  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS
        run: ./vendor/bin/phpcs

  # ---------------------------------------------------------------------------
  # PHPStan static analysis
  # ---------------------------------------------------------------------------
  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse

  # ---------------------------------------------------------------------------
  # JavaScript tests (Jest)
  # ---------------------------------------------------------------------------
  jest:
    name: JavaScript Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-product-optimizer/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --passWithNoTests
